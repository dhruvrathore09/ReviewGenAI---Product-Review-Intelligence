services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: reviewgenai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reviewgenai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React Vite Frontend Static Site
  - type: web
    name: reviewgenai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: reviewgenai-api
          property: host
          transform: "https://${host}/api"

databases:
  # 3. PostgreSQL Managed Database
  - name: reviewgenai-db
    databaseName: product_review_db
    user: reviewgenai_user
    plan: free

